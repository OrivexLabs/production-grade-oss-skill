name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate Skill structure, Markdown, and secrets
        run: python3 scripts/check_skill.py .
      - name: Run release-gate eval
        run: python3 scripts/run_eval.py .
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile validation scripts
        run: python3 -m compileall -q scripts tests
